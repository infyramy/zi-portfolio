    <script>
      try {
        const savedTheme = localStorage.getItem("plud-theme");
        const bootTheme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = bootTheme;
        document.documentElement.style.colorScheme = bootTheme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>

      .boot-splash-progress{display:flex;align-items:baseline;color:inherit;font-size:clamp(2rem,7vw,3.25rem);font-weight:480;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
      .boot-splash-progress small{margin-left:3px;color:inherit;font-size:.28em;font-weight:520;opacity:.72}
      :root[data-theme=dark] .boot-splash{background:#151916;color:#9ca69f}
    </style>
