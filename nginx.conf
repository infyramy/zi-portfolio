server {
  listen 80;
  listen [::]:80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  open_file_cache max=1000 inactive=30s;
  open_file_cache_valid 60s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "public, max-age=0, s-maxage=600, stale-while-revalidate=86400" always;
    add_header CDN-Cache-Control "public, max-age=600, stale-while-revalidate=86400" always;
  }

  location = /site.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=86400";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/css
    text/plain
    application/javascript
    application/json
    application/xml
    image/svg+xml;
}
